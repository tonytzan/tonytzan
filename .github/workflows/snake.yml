# Generates the contribution snake shown in README.md and publishes it to the `output` branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write              # needed to push the generated SVGs to the `output` branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?color_snake=#FFB14A&color_dots=#23261F,#424E29,#6F853E,#9CBB54,#C8F169

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
